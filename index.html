<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Geo-Quiz</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;0,800;1,400&family=Alegreya:ital,wght@0,500;1,400;1,500&display=swap">
<style>
/* Layout concept: a school atlas you can play. The political map is always the largest thing on screen; controls sit beside it like the margin of an atlas page. */
:root{
  --bg:#e4edf0;--panel:#f6fafa;--ink:#0f2f3e;--mute:#4b6675;--line:#c2d3d9;
  --sea:#b4d6e3;--sea-band:#c9e3eb;--sea-text:#3c6c82;
  --l0:#f3dd97;--l1:#f4bda3;--l2:#bcdb9b;--l3:#d4c0e6;--nb:#e6e7dc;--border:#5d6f6b;
  --hi:#0d4f6e;--hover:#7fb3c7;--ok:#12803f;--bad:#cf3423;--warn:#a86a00;--sig-tx:#fff;--cap:#c4122f;
  --btn:#0f2f3e;--btn-tx:#f2f8f9;--tint:rgba(15,47,62,.07);--halo:#fff;
  --sans:"Alegreya Sans","Trebuchet MS","Segoe UI",sans-serif;--serif:"Alegreya",Georgia,serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1c26;--panel:#122935;--ink:#e6f1f4;--mute:#93aebb;--line:#27465a;
  --sea:#0f3142;--sea-band:#163e52;--sea-text:#7fa9bd;
  --l0:#bda863;--l1:#ba8a72;--l2:#83a66c;--l3:#9b88b0;--nb:#2b4653;--border:#0b1c26;
  --hi:#f0fafc;--hover:#4d8aa3;--ok:#3fce7f;--bad:#ff7461;--warn:#f0b43c;--sig-tx:#07202b;--cap:#ff6b7f;
  --btn:#e6f1f4;--btn-tx:#0b1c26;--tint:rgba(230,241,244,.09);--halo:#0b1c26;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1c26;--panel:#122935;--ink:#e6f1f4;--mute:#93aebb;--line:#27465a;
  --sea:#0f3142;--sea-band:#163e52;--sea-text:#7fa9bd;
  --l0:#bda863;--l1:#ba8a72;--l2:#83a66c;--l3:#9b88b0;--nb:#2b4653;--border:#0b1c26;
  --hi:#f0fafc;--hover:#4d8aa3;--ok:#3fce7f;--bad:#ff7461;--warn:#f0b43c;--sig-tx:#07202b;--cap:#ff6b7f;
  --btn:#e6f1f4;--btn-tx:#0b1c26;--tint:rgba(230,241,244,.09);--halo:#0b1c26;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1.0625rem/1.4 var(--sans);-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:3px solid var(--hover);outline-offset:2px}
h1,h2,h3,p{margin:0}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:8px;font-weight:700;background:var(--btn);color:var(--btn-tx)}
.btn:hover{opacity:.9}
.btn.quiet{background:var(--tint);color:var(--ink)}
.btn.quiet:hover{background:var(--line);opacity:1}
.btn[disabled]{opacity:.45;cursor:default}
.text-btn{font-weight:700;color:var(--mute);padding:6px 2px;border-radius:4px}
.text-btn:hover{color:var(--ink)}
.icon-btn{width:40px;height:40px;display:grid;place-items:center;border-radius:8px;color:var(--ink);background:var(--tint)}
.icon-btn:hover{background:var(--line)}
.icon-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Map */
.frame{container-type:size;min-width:0;min-height:0;display:grid;place-items:center}
.stage{position:relative;width:min(100cqw,calc(100cqh * var(--ratio)));aspect-ratio:var(--ratio);background:var(--sea);border-radius:6px;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(15,47,62,.14)}
.map{display:block;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none}
.map .band{fill:none;stroke-linejoin:round;pointer-events:none}
.map .b1{stroke:var(--sea-band);stroke-width:15}
.map .b2{stroke:var(--sea);stroke-width:10}
.map .b3{stroke:var(--sea-band);stroke-width:5}
.map text.sea{font:italic 400 15px var(--serif);fill:var(--sea-text);letter-spacing:.09em;text-anchor:middle;pointer-events:none}
.map .inset{fill:none;stroke:var(--sea-text);stroke-opacity:.55;stroke-width:1;vector-effect:non-scaling-stroke}
.map .seal{fill:none;stroke:var(--border);stroke-opacity:.6;stroke-width:.7;stroke-linejoin:round;pointer-events:none}
.map .nb{fill:var(--nb);stroke:var(--border);stroke-opacity:.55;stroke-width:.6;vector-effect:non-scaling-stroke;stroke-linejoin:round;fill-rule:evenodd}
.map .ct{fill:var(--f);stroke:var(--border);stroke-width:.8;vector-effect:non-scaling-stroke;stroke-linejoin:round;fill-rule:evenodd}
.c0{--f:var(--l0)}.c1{--f:var(--l1)}.c2{--f:var(--l2)}.c3{--f:var(--l3)}
.map.clicky .ct{cursor:pointer}
@media(hover:hover){.map.clicky .ct:hover{fill:var(--hover)}}
.map .ct.hi{fill:var(--hi)}
.map .ct.off{fill:var(--nb);stroke-opacity:.55}
.map.game .ct.off{pointer-events:none}
.map.game .dot.off{display:none}
.map .ct.ok{fill:var(--ok);stroke:var(--halo);stroke-width:1.8}
.map .ct.bad{fill:url(#hatchBad);stroke:var(--halo);stroke-width:1.8}
.map .dot.ok .vis,.map .dot.bad .vis{stroke:var(--halo);stroke-width:2}
.map .ct .hit{fill:transparent;stroke:none;pointer-events:all}
.map .dot .vis{stroke:var(--ink);stroke-width:1.4;vector-effect:non-scaling-stroke}
.map .ping{fill:none;stroke:var(--hi);stroke-width:2;vector-effect:non-scaling-stroke;pointer-events:none;animation:ping 1.5s ease-out infinite}
@keyframes ping{from{opacity:.9;transform:scale(.6)}to{opacity:0;transform:scale(2.2)}}
.map .ping{transform-box:fill-box;transform-origin:center}
.map .labels{pointer-events:none}
.map .labels text{font-family:var(--sans);font-weight:700;fill:var(--ink);stroke:var(--halo);stroke-opacity:.82;paint-order:stroke;stroke-linejoin:round;text-anchor:middle}
.map .labels line{stroke:var(--ink);stroke-opacity:.6;stroke-width:.8;vector-effect:non-scaling-stroke}
.pin text{font-family:var(--sans);font-weight:700;fill:var(--ink);stroke:var(--halo);paint-order:stroke;stroke-linejoin:round;pointer-events:none}
.pin circle{pointer-events:none}
.zoom{position:absolute;right:calc(10px + env(safe-area-inset-right,0px));bottom:10px;display:flex;flex-direction:column;gap:4px}
.zoom .icon-btn{width:36px;height:36px;background:var(--panel);box-shadow:0 0 0 1px var(--line)}

/* Menu */
#menu{min-height:100%;padding-block:18px 24px;max-width:1320px;margin:0 auto}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px 24px;flex-wrap:wrap;margin-bottom:16px}
h1{font-size:clamp(2.8rem,5.5vw,4.4rem);font-weight:800;line-height:.92;letter-spacing:-.024em}
.brand p{color:var(--mute);margin-top:6px;font-size:1.1875rem}
.top-tools{display:flex;align-items:center;gap:8px;min-width:0}
.top-tools input{width:170px;min-width:0;min-height:40px}
.top-tools .btn{min-height:40px;padding:0 14px}
input[type=text]{min-height:46px;padding:0 12px;border-radius:8px;border:1.5px solid var(--line);background:var(--panel);width:100%}
input[type=text]:focus{outline:0;border-color:var(--hi)}
.menu-grid{display:grid;grid-template-columns:minmax(0,1.42fr) minmax(360px,1fr);gap:28px;align-items:start}
.tabs{display:flex;gap:3px;align-items:flex-end}
.tab{padding:10px 18px 8px;border-radius:9px 9px 0 0;font-weight:800;font-size:1.125rem;background:var(--tint);color:var(--mute);display:flex;gap:8px;align-items:baseline;white-space:nowrap}
.tab small{font-weight:500;font-size:.9375rem}
.tab:hover{color:var(--ink);background:var(--line)}
.tab[aria-selected="true"]{background:var(--panel);color:var(--ink)}
.plate{background:var(--panel);border-radius:0 10px 10px 10px;padding:10px;box-shadow:0 14px 34px rgba(15,47,62,.13)}
.areas{padding:2px 2px 10px}
.preview .stage{width:min(100%,calc((100dvh - 372px)*var(--ratio)));min-width:min(100%,420px);margin:0 auto;animation:plate .28s ease-out}
.preview .map{touch-action:pan-y}
.preview .map .ct{cursor:default}
@keyframes stampStill{0%,80%{opacity:.96}100%{opacity:0}}
@keyframes plate{from{opacity:.25}to{opacity:1}}
.caption{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:10px 6px 2px;flex-wrap:wrap}
.caption strong{font:italic 500 1.5rem/1.1 var(--serif)}
.caption span{color:var(--mute);min-width:0}
.caption span b{color:var(--ink);font-weight:700}
.picker{display:grid;gap:14px;align-content:start;padding-top:6px}
#modes{display:grid;gap:12px}
.group h2{font-size:1.125rem;font-weight:800;margin-bottom:5px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.matrix{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:1px;background:var(--line);border-radius:10px;overflow:hidden;box-shadow:0 0 0 1px var(--line)}
.tile{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:7px;min-height:82px;padding:11px 12px 9px;background:var(--panel);text-align:left;font-weight:700;line-height:1.1;min-width:0;hyphens:manual}
.tile:hover{background:var(--bg)}
.tile:focus-visible{outline-offset:-4px}
.tile svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;color:var(--sea-text);flex:none}
.tile .best{position:absolute;right:9px;top:10px;font-size:.875rem;font-weight:500;color:var(--mute);font-variant-numeric:tabular-nums}
.tile[aria-checked="true"]{background:var(--btn);color:var(--btn-tx)}
.tile[aria-checked="true"] svg,.tile[aria-checked="true"] .best{color:inherit}
.ticket{position:sticky;bottom:8px;z-index:2;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 12px 12px 16px;background:var(--panel);border-radius:10px;box-shadow:0 0 0 1px var(--line),0 10px 24px rgba(15,47,62,.14)}
.ticket-text{min-width:0}
.ticket-text strong{display:block;font-size:1.1875rem;font-weight:800;line-height:1.15}
.ticket-text span{display:block;color:var(--mute);line-height:1.2;margin-top:2px}
.ticket .go{min-height:56px;padding:0 28px;font-size:1.25rem;background:var(--ok);color:var(--sig-tx)}
.note-micro{color:var(--mute)}

/* Game */
#game{height:var(--app-h,100%);display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:18px;padding-block:14px}
.side{display:flex;flex-direction:column;gap:12px;min-height:0;overflow:auto;padding:2px}
.side-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.side-top .text-btn{white-space:nowrap}
.where{color:var(--mute);font-size:.9375rem;text-align:right}
.ask{padding-top:10px;border-top:2px solid var(--ink)}
.ask small{display:block;font-size:1.0625rem;color:var(--mute)}
.ask strong{display:block;font-size:clamp(1.9rem,3.2vw,2.6rem);line-height:1.04;font-weight:800;letter-spacing:-.012em;overflow-wrap:anywhere;hyphens:auto;text-wrap:balance}
.stats{display:flex;gap:16px;font-variant-numeric:tabular-nums;color:var(--mute);font-size:1rem;flex-wrap:wrap}
.stats b{color:var(--ink);font-weight:700}
.names-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;color:var(--mute);font-size:.9375rem}
.names-row label{display:inline-flex;align-items:center;gap:6px;cursor:pointer;color:var(--ink);font-weight:500}
.names-row input{width:17px;height:17px;margin:0;accent-color:var(--hi)}
.tray{display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;min-height:44px}
.mchip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:4px 11px;border-radius:7px;background:var(--panel);box-shadow:inset 0 0 0 1.5px var(--ink),0 2px 5px rgba(15,47,62,.16);font-weight:700;line-height:1.1;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;color:var(--ink)}
.mchip:hover{background:var(--tint)}
.mchip.picked{background:var(--btn);color:var(--btn-tx)}
.mchip.ghost{opacity:.3}
.mchip.float{position:fixed;left:0;top:0;z-index:50;pointer-events:none;background:var(--btn);color:var(--btn-tx);box-shadow:0 10px 22px rgba(15,47,62,.32);margin:0}
.chip-layer{position:absolute;inset:0;pointer-events:none;z-index:1}
.chip-layer .mchip{position:absolute;pointer-events:auto;transform:translate(-50%,-50%);min-height:24px;padding:2px 3px 2px 8px;font-size:.9375rem;white-space:nowrap}
.chip-layer .mchip.picked{background:var(--btn)}
.mx{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:4px;font-size:1rem;line-height:1;color:var(--mute)}
.mx:hover{background:var(--line);color:var(--ink)}
.mchip.picked .mx{color:inherit}
.chip-layer .mchip.right,.chip-layer .mchip.wrong{padding:2px 8px;cursor:default;box-shadow:none;color:var(--sig-tx)}
.chip-layer .mchip.right{background:var(--ok)}.chip-layer .mchip.wrong{background:var(--bad)}
.mchip s{opacity:.78;font-weight:500}
.chip-layer .mchip.sol{padding:2px 8px;cursor:default;pointer-events:none;background:var(--panel);color:var(--ink);box-shadow:inset 0 0 0 2px var(--ok)}
.map .ct.filled{fill:var(--hover)}
.map .ct.drop{fill:var(--hi)}
.go-in{flex:2 1 auto}
.prog{height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--ink);transition:width .25s}
.lives{display:inline-flex;gap:4px;vertical-align:-1px}
.lives i{width:13px;height:13px;border-radius:50%;background:var(--bad)}
.lives i.gone{background:var(--line)}
.fb{min-height:68px;display:flex;flex-direction:column;justify-content:flex-start}
.verdict{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:9px;line-height:1.2;animation:verdict .18s ease-out}
.verdict>svg{flex:none;width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.verdict-text{min-width:0;flex:1}
.verdict-text b{display:block;font-size:1.25rem;font-weight:800}
.verdict-text span{display:block;font-size:1rem}
.verdict.good{background:var(--ok);color:var(--sig-tx)}
.verdict.wrong{background:var(--bad);color:var(--sig-tx)}
.verdict.partly{background:var(--warn);color:var(--sig-tx)}
.verdict.again{background:transparent;color:var(--bad);box-shadow:inset 0 0 0 2.5px var(--bad)}
.next-btn{flex:none;min-height:40px;padding:0 12px;border-radius:7px;font-weight:800;background:var(--sig-tx);color:var(--bad)}
@keyframes verdict{from{transform:scale(.96);opacity:.4}to{transform:none;opacity:1}}
.stamp{position:absolute;left:50%;top:16px;width:84px;height:84px;margin-left:-42px;border-radius:50%;display:grid;place-items:center;pointer-events:none;color:var(--sig-tx);animation:stamp .75s ease-out forwards;z-index:2}
.stamp.yes{background:var(--ok)}.stamp.no{background:var(--bad)}
.stamp svg{width:50px;height:50px;fill:none;stroke:currentColor;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
@keyframes stamp{0%{transform:scale(.5);opacity:0}22%{transform:scale(1.05);opacity:.96}65%{transform:scale(1);opacity:.96}100%{transform:scale(1);opacity:0}}
.stage.flash-yes::after,.stage.flash-no::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;animation:flash .75s ease-out forwards}
.stage.flash-yes::after{box-shadow:inset 0 0 0 7px var(--ok)}.stage.flash-no::after{box-shadow:inset 0 0 0 7px var(--bad)}
@keyframes flash{from{opacity:1}to{opacity:0}}
.ticks{display:flex;gap:2px;height:9px}
.ticks i{flex:1;min-width:0;border-radius:2px;background:var(--line)}
.ticks i.now{background:var(--ink)}
.ticks i.ok{background:var(--ok)}.ticks i.partly{background:var(--warn)}
.ticks i.bad{background:repeating-linear-gradient(45deg,var(--bad) 0 3px,var(--sig-tx) 3px 4px)}
.streak{color:var(--ok);font-weight:700}.streak b{color:inherit}
.typer input.is-right{border-color:var(--ok);box-shadow:0 0 0 2px var(--ok)}
.typer input.is-wrong{border-color:var(--bad);box-shadow:0 0 0 2px var(--bad);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
.save-msg{color:var(--mute);min-height:1.2em}
.lg-ok{background:var(--ok)}.lg-bad{background:repeating-linear-gradient(45deg,var(--bad) 0 3px,var(--sig-tx) 3px 4.500px)}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.choice{min-height:52px;padding:6px 10px;border-radius:8px;background:var(--panel);box-shadow:inset 0 0 0 1.5px var(--line);font-weight:700;line-height:1.15;overflow-wrap:anywhere}
.choice:hover{box-shadow:inset 0 0 0 2px var(--ink)}
.choice.ok{background:var(--ok);color:var(--sig-tx);box-shadow:none}
.choice.ok::before{content:"✓ "}.choice.bad::before{content:"✗ "}
.choice.bad{background:var(--bad);color:var(--sig-tx);box-shadow:none}
.choice[disabled]{cursor:default}
.typer{display:grid;grid-template-columns:1fr auto;gap:8px}
.typer input{font-size:1.1875rem}
.typer input,.typer .btn{min-height:52px}
.typer-foot{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-top:6px}
.typer-foot .text-btn{white-space:nowrap}
.final b.score{display:block;font-size:clamp(3rem,5vw,4.2rem);font-weight:800;line-height:1;letter-spacing:-.02em}
.final p{color:var(--mute)}
.missed{list-style:none;margin:0;padding:0;font-size:1rem}
.missed li{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-top:1px solid var(--line)}
.missed li span:last-child{color:var(--mute);text-align:right}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.btn-row .btn{flex:1 1 auto}
.note{color:var(--mute);font-size:.9375rem}
.legend{display:flex;gap:14px;font-size:.9375rem;color:var(--mute)}
.legend{flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* Flash cards */
#cards{height:100%;display:flex;flex-direction:column;gap:14px;padding-block:14px;max-width:640px;margin:0 auto}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.seg{display:flex;background:var(--tint);border-radius:8px;padding:3px;gap:2px}
.seg button{flex:1;min-height:38px;padding:0 10px;border-radius:6px;font-weight:700;font-size:.9375rem;color:var(--mute)}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.deck{flex:1;min-height:280px;position:relative;perspective:1400px}
.deck::before,.deck::after{content:"";position:absolute;background:var(--panel);border-radius:14px;box-shadow:0 0 0 1px var(--line)}
.deck::before{inset:12px -7px -7px 12px;opacity:.5}
.deck::after{inset:6px -3px -3px 6px;opacity:.8}
.deck.last::before,.deck.last::after{display:none}
.card{position:absolute;inset:0;z-index:1;display:block;width:100%;height:100%;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.3,.8,.3,1);border-radius:14px}
.card.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--panel);border-radius:14px;box-shadow:0 0 0 1px var(--line),0 12px 28px rgba(15,47,62,.14);display:flex;flex-direction:column;overflow:hidden;text-align:left}
.face.back{transform:rotateY(180deg)}
.face-text{padding:18px 22px 14px}
.face-text small{display:block;color:var(--mute);font-size:1rem}
.face-text strong{display:block;font-size:clamp(2rem,6.2vw,3.2rem);font-weight:800;line-height:1.04;letter-spacing:-.015em;overflow-wrap:anywhere;hyphens:auto}
.face.back .face-text strong{font-family:var(--serif);font-weight:500;font-style:italic;letter-spacing:0}
.face-text .note{margin-top:4px}
.face-map{flex:1;min-height:0;background:var(--sea);position:relative}
.face-map svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.face-map .land{fill:var(--nb);stroke:var(--border);stroke-opacity:.35;stroke-width:.6;vector-effect:non-scaling-stroke;fill-rule:evenodd}
.face-map .me{fill:var(--hi);stroke:none;fill-rule:evenodd}
.face-hint{margin:0;padding:0 22px 14px;color:var(--mute);font-size:.9375rem}
.card-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card-actions .btn{min-height:54px;font-size:1.125rem}
.card-actions .yes{background:var(--ok);color:var(--sig-tx)}
.card-actions .no{background:var(--tint);color:var(--ink)}
.keys{color:var(--mute);font-size:.875rem;text-align:center}
@media(hover:none){.keys{display:none}}

/* Leaderboard */
#board{max-width:760px;margin:0 auto;padding-block:20px 32px;display:grid;gap:14px}
#board h2{font-size:2.2rem;font-weight:800;letter-spacing:-.015em}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip small{font-weight:500;opacity:.8}
.chip{padding:7px 12px;border-radius:7px;background:var(--tint);font-weight:700;color:var(--mute);font-size:.9375rem}
.chip[aria-pressed="true"]{background:var(--btn);color:var(--btn-tx)}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:9px 8px;text-align:left;border-top:1px solid var(--line)}
th{font-size:.9375rem;color:var(--mute);font-weight:500;border-top:0}
td:first-child,th:first-child{width:2.5em}
tr.me td{background:var(--tint);font-weight:700}

  .menu-grid{grid-template-columns:minmax(0,1fr);gap:18px}

  .top-tools{width:100%}.top-tools input{flex:1;width:auto}
  .plate{padding:6px}
  .preview .stage{width:100%;min-width:0}
  .zoom .icon-btn{width:32px;height:32px}
  .side-b{max-height:52dvh;overflow:auto}
  .side-a>*,.side-b>*{flex-shrink:0}

  .side-a,.side-b{display:flex;flex-direction:column;gap:7px;min-width:0}

  .choice{min-height:46px}

  .mx{width:17px;height:17px}

  .map text.sea{display:none}

}

}

  const typed=forms(raw),all=[answer,...(ALIAS[answer]||[])].flatMap(forms);
  if(typed.some(v=>all.includes(v)))return true;

  const lives=m.lives?`<span class="lives" aria-label="${G.lives} Leben">${[0,1,2].map(n=>`<i class="${n<G.lives?"":"gone"}"></i>`).join("")}</span>`:"";

function renderTicks(){const t=$("#ticks");if(!t)return;

const MARK={good:'<path d="m5 12.500 4.500 4.500L19 7.500"/>',partly:'<path d="m5 12.500 4.500 4.500L19 7.500"/>',wrong:'<path d="M6.500 6.500l11 11M17.500 6.500l-11 11"/>',again:'<path d="M6.500 6.500l11 11M17.500 6.500l-11 11"/>'};
/* The verdict uses a filled block, an icon and a word, so it never relies on colour alone. */
function setFb(kind,title,detail,withNext){const f=$("#fb");if(!kind){f.innerHTML="";return}

  if(withNext)$("#nextBtn").onclick=()=>G.adv&&G.adv()}
function stamp(good){const st=$("#stage");if(!st)return;st.querySelectorAll(".stamp").forEach(e=>e.remove());

  $("#tray").innerHTML=X.tray.length?X.tray.map(c=>chipHtml(c,false)).join(""):`<span class="note">Alle Namen liegen auf der Karte. Du kannst sie noch verschieben.</span>`;
  $("#chipLayer").innerHTML=Object.entries(X.place).map(([k,c])=>chipHtml(c,true).replace('class="mchip','data-at="'+k+'" class="mchip on-map')).join("");
  Object.entries(G.map.els).forEach(([k,e])=>e.classList.toggle("filled",X.place[k]!=null));
  $("#mStats").innerHTML=`<span><b>${placed}</b> von ${total} zugeordnet</span>`;
  $("#mBtns").innerHTML=`<button class="btn go-in" id="mSubmit"${open?" disabled":""}>${open?`Noch ${open} offen`:"Abgeben"}</button><button class="btn quiet" id="mClear"${placed?"":" disabled"}>Alle wegnehmen</button>`;
  $("#mSubmit").onclick=matchSubmit;
  $("#mClear").onclick=()=>{X.place={};X.tray=shuf(X.ks);X.sel=null;matchRender()};
  matchLayout();
}
function matchLayout(){
  const layer=$("#chipLayer");if(!layer||!G.map)return;
  const mv=G.map,u=mv.unit(),[vx,vy]=mv.v,W=layer.clientWidth,H=layer.clientHeight,boxes=[],below=X.m.want=="cap"?15:0;
  [...layer.children].map(el=>{const p=MAPS[region].items[+el.dataset.at];return{el,x:(p.lx-vx)/u,y:(p.ly-vy)/u+below}}).sort((a,b)=>a.y-b.y).forEach(o=>{
    const w=o.el.offsetWidth,h=o.el.offsetHeight;let x=Math.min(W-w/2-3,Math.max(w/2+3,o.x)),y=Math.min(H-h/2-3,Math.max(h/2+3,o.y));
    for(let i=0;i<14;i++){const hit=boxes.find(b=>Math.abs(b.x-x)<(b.w+w)/2+2&&Math.abs(b.y-y)<(b.h+h)/2+1);if(!hit)break;y=hit.y+(hit.h+h)/2+2}
    boxes.push({x,y,w,h});o.el.style.left=x+"px";o.el.style.top=y+"px"});
}
function matchWhere(c){const e=Object.entries(X.place).find(([,v])=>v===c);return e?+e[0]:null}
function matchPlace(c,k){
  if(X.done||!X.act.has(k))return;
  const from=matchWhere(c),old=X.place[k];
  if(from!=null)delete X.place[from];
  if(old!=null&&old!==c){if(from!=null)X.place[from]=old;else X.tray.push(old)}
  X.place[k]=c;X.tray=X.tray.filter(t=>t!==c);X.sel=null;matchRender();
}
function matchTake(c){const from=matchWhere(c);if(from==null)return;delete X.place[from];X.tray.push(c);X.sel=null;matchRender()}
function matchTarget(x,y){
  const st=$("#stage").getBoundingClientRect();if(x<st.left||x>st.right||y<st.top||y>st.bottom)return null;
  const el=document.elementFromPoint(x,y),on=el&&el.closest&&el.closest("[data-at]");if(on)return +on.dataset.at;
  const c=el&&el.closest&&el.closest("[data-k]");if(c&&X.act.has(+c.dataset.k))return +c.dataset.k;
  const u=G.map.unit(),[vx,vy]=G.map.v;let best=null,bd=20;
  X.act.forEach(k=>{const p=MAPS[region].items[k],d=Math.hypot(st.left+(p.lx-vx)/u-x,st.top+(p.ly-vy)/u-y);if(d<bd){bd=d;best=k}});
  return best;
}
$("#game").addEventListener("pointerdown",e=>{
  if(!X||X.done||$("#game").hidden)return;const chip=e.target.closest&&e.target.closest(".mchip");if(!chip)return;
  if(e.target.closest("[data-x]")){e.preventDefault();matchTake(+chip.dataset.c);return}
  e.preventDefault();e.stopPropagation();
  const c=+chip.dataset.c,sx=e.clientX,sy=e.clientY;let float=null,over=null;
  const setOver=k=>{if(over===k)return;if(over!=null)G.map.els[over].classList.remove("drop");over=k;if(k!=null)G.map.els[k].classList.add("drop")};
  const move=ev=>{
    if(!float&&Math.hypot(ev.clientX-sx,ev.clientY-sy)<6)return;
    if(!float){float=chip.cloneNode(true);float.classList.add("float");float.classList.remove("on-map");float.style.left=float.style.top="";document.body.appendChild(float);chip.classList.add("ghost")}
    float.style.transform=`translate(${ev.clientX}px,${ev.clientY}px) translate(-50%,-120%)`;setOver(matchTarget(ev.clientX,ev.clientY))};
  const end=ev=>{document.removeEventListener("pointermove",move);document.removeEventListener("pointerup",end);document.removeEventListener("pointercancel",end);
    if(!float){X.sel=X.sel===c?null:c;matchRender();return}
    const k=ev.type=="pointerup"?matchTarget(ev.clientX,ev.clientY):null;setOver(null);float.remove();
    if(k!=null)matchPlace(c,k);else if(ev.type=="pointerup"){matchTake(c);matchRender()}else matchRender()};
  document.addEventListener("pointermove",move);document.addEventListener("pointerup",end);document.addEventListener("pointercancel",end);
});
function matchSubmit(){
  if(X.done||Object.keys(X.place).length<X.ks.length)return;
  X.done=true;X.sel=null;const items=MAPS[region].items,where=Object.fromEntries(Object.entries(X.place).map(([k,c])=>[c,+k]));
  const wrong=X.ks.filter(c=>where[c]!==c),all=X.ks.length,right=all-wrong.length;
  Object.values(G.map.els).forEach(e=>e.classList.remove("filled"));
  X.ks.forEach(c=>{G.map.mark(where[c],where[c]===c?"ok":"bad")});
  wrong.forEach(c=>G.map.mark(c,"ok"));
  $("#tray").innerHTML="";const help=$("#mHelp");if(help)help.remove();
  const layer=$("#chipLayer");
  [...layer.children].forEach(el=>{const c=+el.dataset.c,good=where[c]===c;el.classList.add(good?"right":"wrong");
    el.innerHTML=good?`✓ ${esc(chipText(c))}`:`✗ <s>${esc(chipText(c))}</s>`});
  /* The correct place of every misplaced name gets its own solution label. */
  layer.insertAdjacentHTML("beforeend",wrong.map(c=>`<div class="mchip sol" data-at="${c}" data-c="${c}">${esc(chipText(c))} gehört hierher</div>`).join(""));
  matchLayout();
  setFb(right==all?"good":right>=all/2?"partly":"wrong",right==all?"Alles richtig!":`${right} von ${all} richtig`,right==all?"Alle liegen am richtigen Ort.":"Grün zeigt, wo die falschen Namen hingehört hätten.");
  stamp(right==all);
  $("#mStats").innerHTML="";
  $("#mList").innerHTML=wrong.map(c=>`<li><span>${esc(X.m.want=="n"?items[c].n:`${items[c].cap} (${items[c].n})`)}</span><span>Du: ${esc(items[where[c]].n)}</span></li>`).join("");
  $("#mBtns").innerHTML=`<button class="btn" id="mNext">Neue Runde</button>`;$("#mNext").onclick=matchRound;
}

/* ---------- Flash cards ---------- */
let C=null;
function startCards(){
  C={items:selItems(),dir:store.get("gq_dir")||"land",deck:[],flip:false,known:0,again:new Set()};
  C.deck=shuf(C.items);C.all=C.items;renderCards();show("cards");
}
function miniMap(p,withPin){
  const M=MAPS[region],land=M.nb.concat(M.items.map(i=>i.d)).join("");
  const[x,y,w,h]=p.box,S=Math.max(w,h,90)*1.75,AR=1.9,W=S*AR>=S?S*AR:S,H=S;
  const vb=[x+w/2-W/2,y+h/2-H/2,W,H].map(n=>+n.toFixed(1)).join(" ");
  const u=H/420;
  const me=p.isl?`<circle class="me" cx="${p.cx}" cy="${p.cy}" r="${6*u}"/>`:`<path class="me" d="${p.d}"/>`;
  const pin=withPin?`<circle cx="${p.cx}" cy="${p.cy}" r="${6*u}" fill="var(--halo)" stroke="var(--cap)" stroke-width="${2.4*u}"/><circle cx="${p.cx}" cy="${p.cy}" r="${2*u}" fill="var(--cap)"/>`:"";
  return `<div class="face-map"><svg viewBox="${vb}" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><path class="land" d="${land}"/>${me}${pin}</svg></div>`;
}
function regionMap(){const M=MAPS[region],land=M.nb.concat(M.items.map(i=>i.d)).join("");return `<div class="face-map"><svg viewBox="${M.vb.join(" ")}" preserveAspectRatio="xMidYMid meet" aria-hidden="true"><path class="land" d="${land}"/></svg></div>`}
function renderCards(){
  const box=$("#cards");
  if(!C.deck.length){
    box.innerHTML=`<div class="card-head"><button class="text-btn" id="cback">Zurück zum Menü</button></div>
    <div class="final" style="margin:auto 0;display:grid;gap:12px"><b class="score">${C.items.length} von ${C.items.length}</b><p>Alle Karten von ${esc(areaLabel())} sitzen. ${C.again.size?`${C.again.size} davon brauchten eine Wiederholung.`:"Keine einzige Wiederholung."}</p>
    <div class="btn-row"><button class="btn" id="cagain">Alle nochmal</button>${C.again.size?`<button class="btn quiet" id="chard">Nur die schweren (${C.again.size})</button>`:""}</div></div>`;
    $("#cback").onclick=()=>show("menu");$("#cagain").onclick=startCards;
    if(C.again.size)$("#chard").onclick=()=>{const hard=[...C.again];C.deck=shuf(hard);C.items=hard;C.again=new Set();C.flip=false;renderCards()};
    return;
  }
  const p=C.deck[0];
  if(C.cardDir==null||C.cardFor!==p){C.cardFor=p;C.cardDir=C.dir=="mix"?(Math.random()<.5?"land":"cap"):C.dir}
  const landFirst=C.cardDir=="land",note=NOTES[p.n]?`<p class="note">${NOTES[p.n]}</p>`:"";
  const landFace=(h)=>`<div class="face-text"><small>Land</small><strong>${esc(p.n)}</strong>${note}</div>${miniMap(p,false)}${h}`;
  const capFace=(h,map)=>`<div class="face-text"><small>Hauptstadt</small><strong>${esc(p.cap)}</strong></div>${map?miniMap(p,true):`<p class="face-hint">Welches Land gehört dazu?</p>${regionMap()}`}${h}`;
  const landOnBack=`<div class="face-text"><small>Land</small><strong style="font-family:var(--serif);font-weight:500;font-style:italic">${esc(p.n)}</strong>${note}<p class="note" style="margin-top:6px">Hauptstadt ${esc(p.cap)}</p></div>${miniMap(p,true)}`;
  const front=landFirst?landFace(""):capFace("",false);
  const back=landFirst?`<div class="face-text"><small>Hauptstadt von ${esc(p.n)}</small><strong>${esc(p.cap)}</strong></div>${miniMap(p,true)}`:landOnBack;
  const done=C.items.length-C.deck.length;
  box.innerHTML=`<div class="card-head"><button class="text-btn" id="cback">Zurück zum Menü</button><span class="where" style="display:block">${done} von ${C.items.length} sitzen</span></div>
  <div class="prog"><i style="width:${done/C.items.length*100}%"></i></div>
  <div class="seg" role="group" aria-label="Was steht vorne?">${[["land","Land vorne"],["cap","Hauptstadt vorne"],["mix","Gemischt"]].map(([v,l])=>`<button data-d="${v}" aria-pressed="${C.dir==v}">${l}</button>`).join("")}</div>
  <div class="deck${C.deck.length==1?" last":""}"><button class="card${C.flip?" flip":""}" id="card" aria-label="Karte umdrehen"><div class="face front">${front}</div><div class="face back">${back}</div></button></div>
  <div class="card-actions">${C.flip?`<button class="btn no" id="cno">Nochmal zeigen</button><button class="btn yes" id="cyes">Gewusst</button>`:`<button class="btn" id="cflip" style="grid-column:1/3">Karte umdrehen</button>`}</div>
  <p class="keys">Leertaste dreht die Karte um, Pfeil links zeigt sie nochmal, Pfeil rechts heißt gewusst.</p>`;
  $("#cback").onclick=()=>show("menu");
  box.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{C.dir=b.dataset.d;store.set("gq_dir",C.dir);C.cardDir=null;C.flip=false;renderCards()});
  $("#card").onclick=flipCard;
  if(C.flip){$("#cno").onclick=()=>rate(false);$("#cyes").onclick=()=>rate(true)}else $("#cflip").onclick=flipCard;
}
function flipCard(){C.flip=!C.flip;
  const c=$("#card");c.classList.toggle("flip",C.flip);
  const a=document.querySelector(".card-actions");
  a.innerHTML=C.flip?`<button class="btn no" id="cno">Nochmal zeigen</button><button class="btn yes" id="cyes">Gewusst</button>`:`<button class="btn" id="cflip" style="grid-column:1/3">Karte umdrehen</button>`;
  if(C.flip){$("#cno").onclick=()=>rate(false);$("#cyes").onclick=()=>rate(true)}else $("#cflip").onclick=flipCard;
}
function rate(knew){const p=C.deck.shift();
  if(!knew){C.again.add(p);C.deck.splice(Math.min(4,C.deck.length),0,p)}
  C.flip=false;C.cardFor=null;renderCards()}
document.addEventListener("keydown",e=>{
  if(!$("#game").hidden&&G&&G.done&&!G.over&&G.adv&&e.key=="Enter"&&!e.repeat&&e.target.tagName!="BUTTON"){e.preventDefault();G.adv();return}
  if(!$("#cards").hidden&&C&&C.deck.length){
    if(e.target.tagName=="INPUT")return;
    if(e.key==" "||e.key=="Enter"){if(e.target.closest&&e.target.closest("[data-d],#cback"))return;e.preventDefault();flipCard()}
    else if(e.key=="ArrowLeft"&&C.flip)rate(false);
    else if(e.key=="ArrowRight"&&C.flip)rate(true);
    return;
  }
  if(!$("#game").hidden&&G&&!G.over&&G.m.kind=="choice"&&"1234".includes(e.key)){const b=document.querySelectorAll(".choice")[+e.key-1];if(b&&!b.disabled)b.click()}
});

/* ---------- Leaderboard ---------- */
const BOARD=[1,2,6,5,4,9,7,8];
let bR="Europa",bM=1,bA="Alle";
async function openBoard(r,m,a){
  if(r&&r!=bR)bA="Alle";if(r)bR=r;if(m)bM=m;if(a)bA=a;
  show("board");const b=$("#board");
  b.innerHTML=`<button class="text-btn" id="bb" style="justify-self:start">Zurück zum Menü</button><h2>Bestenliste</h2>
  <div class="chips">${Object.keys(MAPS).map(k=>`<button class="chip" data-r="${k}" aria-pressed="${k==bR}">${k}</button>`).join("")}</div>
  <div class="chips">${["Alle",...Object.keys(AREAS[bR])].map(k=>`<button class="chip" data-ba="${k}" aria-pressed="${k==bA}">${k}</button>`).join("")}</div>
  <div class="chips">${BOARD.map(n=>`<button class="chip" data-m="${n}" aria-pressed="${n==bM}">${MODES[n].t}</button>`).join("")}</div>
  <div id="bl" class="note">Lade Ergebnisse…</div>`;
  $("#bb").onclick=()=>{renderModes();show("menu")};
  b.querySelectorAll("[data-r]").forEach(x=>x.onclick=()=>openBoard(x.dataset.r,bM));
  b.querySelectorAll("[data-ba]").forEach(x=>x.onclick=()=>openBoard(bR,bM,x.dataset.ba));
  b.querySelectorAll("[data-m]").forEach(x=>x.onclick=()=>openBoard(bR,+x.dataset.m));
  const bl=$("#bl"),key=scoreKey(bR,bA,bM),mine=best[key],mineLine=mine?`Dein Bestwert auf diesem Gerät: ${mine.sc}${MODES[bM].timed||MODES[bM].lives?"":" von "+mine.total}, ${fmt(mine.ms)}.`:"Auf diesem Gerät gibt es hier noch keinen Bestwert.";
  if(!DB){bl.textContent=mineLine+" Die gemeinsame Bestenliste gibt es nur in der veröffentlichten Version des Quiz.";return}
  try{const snap=await DB.collection("scores").get(),rows=[];
    snap.docs.forEach(d=>{const v=d.data()||{},o=(v.results||{})[key];if(o)rows.push({id:d.id,name:v.name||"Ohne Namen",...o})});
    rows.sort((x,y)=>y.sc-x.sc||x.ms-y.ms);
    if(!rows.length){bl.textContent="Noch keine Ergebnisse in dieser Kategorie. Spiele eine Runde und trag dich als Erste oder Erster ein.";return}
    const pf=rows.filter(x=>x.sc==x.total).sort((x,y)=>x.ms-y.ms)[0];
    bl.innerHTML=(pf&&!MODES[bM].timed&&!MODES[bM].lives?`<p style="margin-bottom:8px">Schnellste fehlerfreie Runde: <b>${esc(pf.name)}</b> in ${fmt(pf.ms)}</p>`:"")+
      `<div class="tbl-wrap"><table><tr><th>Platz</th><th>Name</th><th>Richtig</th><th>Zeit</th></tr>${rows.slice(0,20).map((x,n)=>`<tr${x.id==UID?' class="me"':""}><td>${n+1}</td><td>${esc(x.name)}</td><td>${x.sc}${MODES[bM].timed||MODES[bM].lives?"":" / "+x.total}</td><td>${fmt(x.ms)}</td></tr>`).join("")}</table></div>`;
  }catch(e){bl.textContent=mineLine+" Die gemeinsame Bestenliste ließ sich nicht laden. Öffne sie später noch einmal."}
}

if(window.visualViewport){const vv=visualViewport,fit=()=>{const r=document.documentElement;
  if(vv.height<innerHeight-80){r.style.setProperty("--app-h",vv.height+"px");if(!$("#game").hidden)window.scrollTo(0,0)}else r.style.removeProperty("--app-h")};
  vv.addEventListener("resize",fit)}
renderMenu();show("menu");
